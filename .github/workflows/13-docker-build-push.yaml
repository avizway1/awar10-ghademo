name: 13 - Build and push Docker image to Docker Hub

on:
    workflow_dispatch:
    push:
        branches: [main]

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: python-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            
            - name: Build and push image
              uses: docker/build-push-action@v7
              with:
                  context: python-app
                  file: python-app/Dockerfile
                  push: true
                  build-args: |
                      APP_VERSION=1.0.${{ github.run_number }}
                      GIT_SHA=${{ github.sha }}
                  tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/awar10-gha-app:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/awar10-gha-app:${{ github.run_id }}