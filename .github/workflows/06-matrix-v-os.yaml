name: 06 - matrix with nodejs versions and OS

on:
    push:
        branches: ["*"]

jobs:
    node-setup:
        strategy:
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                    - windows-latest
                node: 
                    - 22
                    - 24
                    - 26
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                node-version: ${{ matrix.node }}
            - run: node app.js
            - run: node -v
